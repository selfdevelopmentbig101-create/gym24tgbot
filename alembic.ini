# Alembic database migrations. The database URL comes from DATABASE_URL (.env),
# not from this file. The bot and the API apply migrations automatically on start;
# see database/migrate.py. Manual use:
#   alembic upgrade head                              apply all migrations
#   alembic revision --autogenerate -m "add x"        create a migration after changing models
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
